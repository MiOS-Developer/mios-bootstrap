name: build-iso

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PowerShell script syntax
        shell: pwsh
        run: |
          Get-ChildItem -Filter *.ps1 -Recurse | ForEach-Object {
              Write-Host "Checking syntax of: $($_.FullName)"
              $contents = Get-Content -LiteralPath $_.FullName -Raw
              $null = [System.Management.Automation.Language.Parser]::ParseInput($contents, [ref]$null, [ref]$null)
          }

      - name: Install Windows ADK (oscdimg)
        shell: powershell
        run: |
          # Download and install the ADK Deployment Tools (contains oscdimg)
          $url = "https://go.microsoft.com/fwlink/?linkid=2271338" # ADK for Windows 11 24H2/25H2
          $adkInstaller = Join-Path $env:TEMP "adksetup.exe"
          Write-Host "Downloading ADK installer from $url ..."
          Invoke-WebRequest -Uri $url -OutFile $adkInstaller
          Write-Host "Installing ADK Deployment Tools ..."
          Start-Process $adkInstaller -ArgumentList "/features OptionId.DeploymentTools /quiet /norestart" -Wait
          Write-Host "ADK Deployment Tools installed."

      - name: Render and validate private autounattend XML fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./field/autounattend/MiOS-Provision.lib.ps1
          $fixtureDir = Join-Path $env:RUNNER_TEMP ('mios-unattend-' + [Guid]::NewGuid().ToString('N'))
          function Invoke-MiosCiGit {
              param([string]$Repository, [string[]]$Arguments)
              $output = & git -c credential.helper= -c core.hooksPath=NUL -c core.fsmonitor=false -c maintenance.auto=false -c gc.auto=0 -C $Repository @Arguments
              if ($LASTEXITCODE -ne 0) { throw 'Canonical vendor Git data operation failed.' }
              return $output
          }
          function Export-MiosCiVendorBlob {
              param([string]$Repository, [string]$Blob, [string]$Destination)
              $start = [Diagnostics.ProcessStartInfo]::new()
              $start.FileName = (Get-Command git -CommandType Application -ErrorAction Stop).Source
              $start.UseShellExecute = $false
              $start.RedirectStandardOutput = $true
              $start.RedirectStandardError = $true
              foreach ($argument in @('-c', 'credential.helper=', '-c', 'core.hooksPath=NUL', '-C', $Repository, 'cat-file', 'blob', $Blob)) { $start.ArgumentList.Add($argument) }
              $process = [Diagnostics.Process]::Start($start)
              try {
                  $errors = $process.StandardError.ReadToEndAsync()
                  $stream = [IO.FileStream]::new($Destination, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
                  try { $process.StandardOutput.BaseStream.CopyTo($stream) } finally { $stream.Dispose() }
                  $process.WaitForExit()
                  $null = $errors.GetAwaiter().GetResult()
                  if ($process.ExitCode -ne 0) { throw 'Canonical vendor blob read failed.' }
              } finally { $process.Dispose() }
          }
          $layerNames = @('MIOS_BOOTSTRAP_BASE_TOML', 'MIOS_VENDOR_TOML_D', 'MIOS_HOST_TOML', 'MIOS_HOST_TOML_D', 'MIOS_USER_TOML', 'MIOS_USER_TOML_D', 'MIOS_RESOLVED_JSON')
          $savedLayers = @{}
          foreach ($name in $layerNames) { $savedLayers[$name] = [Environment]::GetEnvironmentVariable($name, 'Process') }
          $savedGitPrompt = $env:GIT_TERMINAL_PROMPT
          try {
              $null = New-Item -ItemType Directory -Path $fixtureDir -ErrorAction Stop
              # Isolate CI from host/user configuration; vendor defaults stay unchanged.
              foreach ($name in $layerNames) { [Environment]::SetEnvironmentVariable($name, (Join-Path $fixtureDir ($name + '.absent')), 'Process') }
              $env:MIOS_BOOTSTRAP_BASE_TOML = '-'
              $env:MIOS_RESOLVED_JSON = $null
              $env:GIT_TERMINAL_PROMPT = '0'
              if ($env:MIOS_CI_VENDOR_TOML) {
                  # The isolated Native trial already pins this read-only member by Git blob and SHA-256.
                  if ($env:GITHUB_ACTIONS -ceq 'true') { throw 'Hosted CI resolves its own canonical vendor commit.' }
                  $expected = [IO.Path]::GetFullPath((Join-Path $PWD 'usr/share/mios/mios.toml'))
                  $vendorPath = [IO.Path]::GetFullPath($env:MIOS_CI_VENDOR_TOML)
                  $comparison = if ([IO.Path]::DirectorySeparatorChar -eq '\') { [StringComparison]::OrdinalIgnoreCase } else { [StringComparison]::Ordinal }
                  if (-not [string]::Equals($vendorPath, $expected, $comparison) -or -not (Test-Path -LiteralPath $vendorPath -PathType Leaf)) { throw 'The isolated CI vendor must be the pinned canonical source member.' }
                  $sourceKind = 'pinned-native-member'
              } else {
                  # This repository's mios.toml is an installer layer. Fetch only data from the canonical source.
                  $selection = Read-MiosToml -Path (Resolve-Path ./mios.toml).Path -SingleFile
                  $repository = [string](Get-Toml $selection 'bootstrap.mios_repo' '')
                  $reference = [string](Get-Toml $selection 'bootstrap.mios_ref' '')
                  if ($repository -cnotmatch '\Ahttps://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git\z' -or $reference -notmatch '\A[A-Za-z0-9_][A-Za-z0-9_./-]*\z' -or $reference.Contains('..')) { throw 'Invalid canonical vendor repository or reference.' }
                  $dataRepository = Join-Path $fixtureDir 'canonical-data'
                  $null = New-Item -ItemType Directory -Path $dataRepository -ErrorAction Stop
                  $null = Invoke-MiosCiGit $dataRepository @('init', '--quiet')
                  $null = Invoke-MiosCiGit $dataRepository @('remote', 'add', 'origin', $repository)
                  $null = Invoke-MiosCiGit $dataRepository @('fetch', '--quiet', '--no-tags', '--depth=1', '--filter=blob:none', '--', 'origin', $reference)
                  $vendorCommit = [string](Invoke-MiosCiGit $dataRepository @('rev-parse', '--verify', 'FETCH_HEAD^{commit}'))
                  if ($vendorCommit -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Canonical vendor did not resolve to a concrete commit.' }
                  $blob = [string](Invoke-MiosCiGit $dataRepository @('rev-parse', '--verify', ('{0}:usr/share/mios/mios.toml' -f $vendorCommit)))
                  if ($blob -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Canonical vendor did not resolve to a Git blob.' }
                  $vendorPath = Join-Path $fixtureDir 'canonical-mios.toml'
                  Export-MiosCiVendorBlob $dataRepository $blob $vendorPath
                  $bytes = [IO.File]::ReadAllBytes($vendorPath)
                  $header = [Text.Encoding]::ASCII.GetBytes(('blob ' + $bytes.Length + [char]0))
                  $digest = [Security.Cryptography.SHA1]::Create()
                  try { $actualBlob = [BitConverter]::ToString($digest.ComputeHash([byte[]]($header + $bytes))).Replace('-', '').ToLowerInvariant() } finally { $digest.Dispose() }
                  if ($actualBlob -cne $blob) { throw 'Canonical vendor bytes differ from the resolved Git blob.' }
                  $provenance = @{ commit = $vendorCommit; blob = $blob; bytes = $bytes.Length; sha256 = (Get-FileHash -LiteralPath $vendorPath -Algorithm SHA256).Hash.ToLowerInvariant() }
                  $provenance | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $fixtureDir 'canonical-source.json') -Encoding utf8
                  $sourceKind = 'resolved-git-blob'
              }
              $vendorItem = Get-Item -LiteralPath $vendorPath -Force -ErrorAction Stop
              if ($vendorItem.PSIsContainer -or ($vendorItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $vendorItem.Length -lt 1 -or $vendorItem.Length -gt 8388608) { throw 'Canonical vendor must be a bounded regular source file.' }
              Write-Host ('Canonical MiOS vendor: {0}; SHA256 {1}' -f $sourceKind, (Get-FileHash -LiteralPath $vendorPath -Algorithm SHA256).Hash.ToLowerInvariant())
              $toml = Read-MiosToml -Path $vendorPath -SingleFile
              $random = [byte[]]::new(32)
              $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
              try { $rng.GetBytes($random) } finally { $rng.Dispose() }
              $fixturePassword = 'CiOnly!' + [Convert]::ToBase64String($random)
              if ($env:GITHUB_ACTIONS -ceq 'true') { Write-Output "::add-mask::$fixturePassword" }
              $toml.scalars['identity.default_password'] = $fixturePassword
              $toml.scalars['autounattend.service.svc_password'] = $fixturePassword
              $toml.scalars['field.sysrescue.password'] = $fixturePassword
              foreach ($account in $toml.accounts) { $account.password = $fixturePassword }
              $null = Resolve-MiOSCredentials -Toml $toml
              $scalars = @{}
              foreach ($key in $toml.scalars.Keys) {
                  if ($key -cmatch '^(identity\.|autounattend\.|field\.sysrescue\.|auth\.password_hash$)') { $scalars[$key] = $toml.scalars[$key] }
              }
              $projection = @{ schema = 'mios-resolved-credentials/1'; scalars = $scalars; accounts = @($toml.accounts); has_accounts = ($toml.accounts.Count -gt 0) }
              $resolvedPath = Join-Path $fixtureDir 'resolved.json'
              $xmlPath = Join-Path $fixtureDir 'autounattend.xml'
              Write-MiOSPrivateText -Path $resolvedPath -Text ($projection | ConvertTo-Json -Depth 10)
              ./field/autounattend/New-MiOSAutounattend.ps1 -TomlPath $vendorPath -ResolvedJson $resolvedPath -OutXml $xmlPath
              Assert-MiOSPrivateFile -Path $resolvedPath
              Assert-MiOSPrivateFile -Path $xmlPath
              $xml = [xml]::new()
              $xml.Load($xmlPath)
              if ($xml.DocumentElement.LocalName -cne 'unattend' -or $xml.DocumentElement.NamespaceURI -cne 'urn:schemas-microsoft-com:unattend') { throw 'Unexpected autounattend XML root' }
              Write-Host 'Private autounattend XML fixture is well-formed.'
          } finally {
              foreach ($name in $layerNames) { [Environment]::SetEnvironmentVariable($name, $savedLayers[$name], 'Process') }
              [Environment]::SetEnvironmentVariable('GIT_TERMINAL_PROMPT', $savedGitPrompt, 'Process')
              if (Test-Path -LiteralPath $fixtureDir) { Remove-Item -LiteralPath $fixtureDir -Recurse -Force -ErrorAction Stop }
              $fixturePassword = $null
              $projection = $null
              $toml = $null
          }

  validate-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          find . -name "*.sh" | xargs -I {} bash -n {}

      - name: Verify MiOS-Xbox-Merged.xml is identical to presets/mios-xbox.xml
        run: |
          # presets/mios-xbox.xml is the source of truth; MiOS-Xbox-Merged.xml is a tracked copy.
          if ! cmp field/autounattend/presets/mios-xbox.xml field/autounattend/MiOS-Xbox-Merged.xml; then
            echo "::error file=field/autounattend/MiOS-Xbox-Merged.xml::MiOS-Xbox-Merged.xml differs from presets/mios-xbox.xml (the source). Edit presets/mios-xbox.xml, then run: cp field/autounattend/presets/mios-xbox.xml field/autounattend/MiOS-Xbox-Merged.xml"
            exit 1
          fi
          echo "MiOS-Xbox-Merged.xml is byte-identical to presets/mios-xbox.xml."

      - name: llms.txt follows the llms.txt format (llmstxt.org)
        # This repo owns llms.txt (mios.git [bootstrap.sync].not_mirrored), so
        # mios.git's Law 15 parity gate never reads it and this step is its only
        # gate. The validator is mios.git's Rust conformance binary; only
        # tools/native and the toolchain pin are fetched, outside the workspace.
        # The success line is required, not just exit 0: a mios.git that
        # predates --llms-txt builds a binary that exits 0 without validating.
        run: |
          set -euo pipefail
          mios="${RUNNER_TEMP}/mios"
          git clone --depth 1 --filter=blob:none --no-checkout \
              https://github.com/mios-dev/mios.git "$mios"
          git -C "$mios" sparse-checkout set --no-cone /tools/native/ /rust-toolchain.toml
          git -C "$mios" checkout
          rc=0
          out="$(cd "$mios/tools/native" && cargo run -q --target x86_64-unknown-linux-gnu -p mios-template-conform -- \
              --llms-txt --root "$GITHUB_WORKSPACE")" || rc=$?
          printf '%s\n' "$out"
          if (( rc == 1 )) && grep -q '^\[llms-txt\] .*: [0-9]* violation' <<<"$out"; then
            echo "::error file=llms.txt::llms.txt does not follow the llms.txt format; the violations are listed above"
            exit 1
          fi
          if (( rc != 0 )); then
            echo "::error::mios.git's mios-template-conform did not run cleanly (exit $rc), so llms.txt was not validated; see the output above"
            exit "$rc"
          fi
          if ! grep -q '^\[llms-txt\] .* conforms to ' <<<"$out"; then
            echo "::error file=llms.txt::mios.git's mios-template-conform printed no --llms-txt result, so llms.txt was not validated"
            exit 1
          fi
